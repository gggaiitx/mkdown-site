# 码克 macOS 构建流水线
# 前提：仓库托管到 GitHub 后，push 或手动触发（Actions 页 Run workflow）。
# 产物：.app 打包的 .dmg（Apple Silicon + Intel 双架构），在 Actions 运行页 Artifacts 下载。
# 说明：Tauri 的 macOS 包只能在 macOS 上编译（Xcode 链路），本机 Windows 无法交叉编译，
#       故借用 GitHub 免费的 macos-14 运行器。

name: build-mac

on:
  workflow_dispatch: # 手动触发
  push:
    tags:
      - 'v*' # 打 v* 标签时自动构建

jobs:
  build-macos:
    # gh release upload 需要 GITHUB_TOKEN 具备 Release 写权限（默认只读会 403）
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin # Apple Silicon (M1/M2/M3/M4)
          - target: x86_64-apple-darwin # Intel
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      - name: 构建（dmg）
        run: |
          rustup target add ${{ matrix.target }}
          npx tauri build --target ${{ matrix.target }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: makeke-macos-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: 规范资产名并上传到 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          DIR="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          # 资产名统一 ASCII（中文文件名在部分上传链路会被吞，见 2026-09-27 日志）
          ARCH=${{ matrix.target }}   # aarch64-apple-darwin / x86_64-apple-darwin
          mv "$DIR"/*.dmg "$DIR/Mkdown_${VERSION}_${ARCH}.dmg"
          gh release upload "${{ github.ref_name }}" --clobber "$DIR/Mkdown_${VERSION}_${ARCH}.dmg"
