# 码克 macOS 构建流水线
# 前提：仓库托管到 GitHub 后，push 或手动触发（Actions 页 Run workflow）。
# 产物：.app 打包的 .dmg（Apple Silicon + Intel 双架构），在 Actions 运行页 Artifacts 下载。
# 说明：Tauri 的 macOS 包只能在 macOS 上编译（Xcode 链路），本机 Windows 无法交叉编译，
#       故借用 GitHub 免费的 macos-14 运行器（macos-13 已退役，勿改回）。
#       签名/公证：当前 dmg **未做 Apple 代码签名与公证**（需 Apple Developer 凭证，
#       属发布流程后续项，不在 CI 伪造签名）。未公证产物首次打开会被 Gatekeeper
#       拦截，用户需右键打开或 `xattr -cr`；应用内自动更新侧的应对见
#       src-tauri/src/commands/update_cmd.rs 的 macOS 分支注释。

name: build-mac

on:
  workflow_dispatch: # 手动触发
  push:
    tags:
      - 'v*' # 打 v* 标签时自动构建

jobs:
  build-macos:
    # gh release upload 需要 GITHUB_TOKEN 具备 Release 写权限（默认只读会 403）
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin # Apple Silicon (M1/M2/M3/M4)
          - target: x86_64-apple-darwin # Intel
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      # —— 依赖审计（P2-5，报告级：只警告不阻断）——
      # 与 build-windows 同口径；待依赖整改后收紧为阻断门禁。
      - name: 依赖审计（npm，报告级）
        run: npm audit --audit-level=high || echo "::warning::npm audit findings (report-only)"

      - name: 依赖审计（cargo，报告级）
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
        continue-on-error: true

      - name: 构建（dmg）
        run: |
          rustup target add ${{ matrix.target }}
          npx tauri build --target ${{ matrix.target }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: makeke-macos-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: 规范资产名并上传到 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          DIR="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          # 资产名统一 ASCII（中文文件名在部分上传链路会被吞，见 2026-09-27 日志）
          ARCH=${{ matrix.target }}   # aarch64-apple-darwin / x86_64-apple-darwin
          mv "$DIR"/*.dmg "$DIR/Mkdown_${VERSION}_${ARCH}.dmg"
          # 兜底：Release 不存在则先创建，说明取自标签说明（annotated tag message，写清更新内容，别再"见提交历史"）
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            git fetch -q origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}" --no-tags --force
            # 注意：必须用 %(contents) 取完整标签说明，不能用 %(contents:body)。
            # %(contents:body) 只返回第一段之后的正文；本仓库发布说明首段为「## 新特性」+其条目
            # （标题与列表间无空行），会被 Git 整体当作 subject 吞掉，导致新特性在 Release 正文丢失。
            git tag -l --format='%(contents)' "${{ github.ref_name }}" > rel-notes.md
            # 两个架构的 job 与 build-windows 会同时走到这里：view 与 create 之间有窗口，
            # 后到的必撞 HTTP 422「Release.tag_name already exists」。把 create 的失败交给
            # 紧随其后的 view 兜底判定——对方刚建好即算成功（标题与正文同源于 annotated tag，
            # 谁建都一样），真出错时 view 也会失败，不会把故障吞成静默
            gh release create "${{ github.ref_name }}" --title "码克 MkDown ${{ github.ref_name }}" --notes-file rel-notes.md 2>/dev/null \
              || gh release view "${{ github.ref_name }}" >/dev/null
          fi
          gh release upload "${{ github.ref_name }}" --clobber "$DIR/Mkdown_${VERSION}_${ARCH}.dmg"
