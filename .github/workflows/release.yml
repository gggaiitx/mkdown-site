# 码克发布流水线（Windows + macOS 双端，一个 workflow 两份产物）
#
# 触发：push v* 标签自动跑；workflow_dispatch 手动跑（可指定 ref 为某个 tag，补传历史版本安装包）。
# 产物：Windows NSIS 安装包（x64）+ macOS 双架构 .dmg，tag 触发时按
#       Mkdown_${VERSION}_{x64-setup.exe | aarch64-apple-darwin.dmg | x86_64-apple-darwin.dmg}
#       规范成 ASCII 资产名挂到同名 GitHub Release（官网三条直链严格照这个模板）。
#
# 为什么两端并成一个文件：原先 build-windows.yml / build-mac.yml 两个 workflow 由同一个 tag
# 同时触发，天然并行。飞总要求「先 win 后 mac」，而 Actions 的 needs 不能跨 workflow 文件，
# 所以两端必须并到这一个文件里，mac 那侧靠 needs 排队。
#
# 排序只借 needs 拿时序，不引入依赖：mac 那侧写 if: '!cancelled()'，
# Windows 失败时 mac 照旧出包（两端原本就互不依赖，别让一条链路挂掉拖死另一条）。
# 顺带的好处：Release 恒定由 Windows job 先建，mac 双架构再也不会跟它抢
# （f8cadac 修的那次 422 抢建竞态就是这么来的）。
#
# macOS 侧前提：Tauri 的 mac 包只能在 macOS 上编译（Xcode 链路），本机 Windows 无法交叉编译，
#   故借用 GitHub 免费的 macos-14 运行器（macos-13 已退役，勿改回）。
#   签名/公证：当前 dmg **未做 Apple 代码签名与公证**（需 Apple Developer 凭证，属发布流程
#   后续项，不在 CI 伪造签名）。未公证产物首次打开会被 Gatekeeper 拦截，用户需右键打开或
#   `xattr -cr`；应用内自动更新侧的应对见 src-tauri/src/commands/update_cmd.rs 的 macOS 分支注释。
# Windows 侧说明：bundle.targets 里的 app/dmg 为 macOS 专属格式，Windows 侧用 --bundles nsis 显式限定。

name: release

on:
  workflow_dispatch: # 手动触发
  push:
    tags:
      - 'v*' # 打 v* 标签时自动构建

jobs:
  build-windows:
    # gh release upload 需要 GITHUB_TOKEN 具备 Release 写权限（默认只读会 403）
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      # —— 依赖审计（P2-5，报告级：只警告不阻断）——
      # 现有 xlsx 存在公开 CVE，直接设门禁会挂 CI，故两步均配置为报告级；
      # 待依赖整改后去掉 continue-on-error / || echo 收紧为阻断门禁。
      - name: 依赖审计（npm，报告级）
        # windows-latest 的 run 默认 shell 是 pwsh，其包装器结尾会 exit $LASTEXITCODE，
        # `|| echo` 救不回 npm audit 的退出码 1（v0.5.6 首跑实测被拦）；显式 bash 使 || 语义生效。
        shell: bash
        run: npm audit --audit-level=high || echo "::warning::npm audit findings (report-only)"

      - name: 依赖审计（cargo，报告级）
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
        continue-on-error: true

      - name: 构建（NSIS 安装包）
        run: npx tauri build --bundles nsis

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: makeke-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: 规范资产名并上传到 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          DIR="src-tauri/target/release/bundle/nsis"
          # 资产名统一 ASCII（productName 为中文，默认安装包名含中文在部分上传链路会被吞，见 2026-09-27 日志）
          mv "$DIR"/*-setup.exe "$DIR/Mkdown_${VERSION}_x64-setup.exe"
          # 兜底：Release 不存在则先创建，说明取自标签说明（annotated tag message，写清更新内容，别再"见提交历史"）
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            git fetch -q origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}" --no-tags --force
            # 注意：必须用 %(contents) 取完整标签说明，不能用 %(contents:body)。
            # %(contents:body) 只返回第一段之后的正文；本仓库发布说明首段为「## 新特性」+其条目
            # （标题与列表间无空行），会被 Git 整体当作 subject 吞掉，导致新特性在 Release 正文丢失。
            git tag -l --format='%(contents)' "${{ github.ref_name }}" > rel-notes.md
            # 本 job 现在恒定最先建 Release（mac 排在它后面），这里的 create 兜底只防手动重跑
            # 单 job 时的空档；create 失败仍用 view 判一次，别把「对方刚建好」当成出错
            gh release create "${{ github.ref_name }}" --title "码克 MkDown ${{ github.ref_name }}" --notes-file rel-notes.md 2>/dev/null \
              || gh release view "${{ github.ref_name }}" >/dev/null
          fi
          gh release upload "${{ github.ref_name }}" --clobber "$DIR/Mkdown_${VERSION}_x64-setup.exe"

  build-macos:
    # 只借 needs 拿「先 win 后 mac」的时序；if 用 !cancelled() 让 Windows 失败时 mac 照旧出包，
    # 不新引入跨端依赖（工作流被取消时不白烧 mac 运行器分钟）
    needs: build-windows
    if: ${{ !cancelled() }}
    # gh release upload 需要 GITHUB_TOKEN 具备 Release 写权限（默认只读会 403）
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin # Apple Silicon (M1/M2/M3/M4)
          - target: x86_64-apple-darwin # Intel
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      # —— 依赖审计（P2-5，报告级：只警告不阻断）——
      # 与 build-windows 同口径；待依赖整改后收紧为阻断门禁。
      - name: 依赖审计（npm，报告级）
        run: npm audit --audit-level=high || echo "::warning::npm audit findings (report-only)"

      - name: 依赖审计（cargo，报告级）
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
        continue-on-error: true

      - name: 构建（dmg）
        run: |
          rustup target add ${{ matrix.target }}
          npx tauri build --target ${{ matrix.target }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: makeke-macos-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: 规范资产名并上传到 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          DIR="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          # 资产名统一 ASCII（中文文件名在部分上传链路会被吞，见 2026-09-27 日志）
          ARCH=${{ matrix.target }}   # aarch64-apple-darwin / x86_64-apple-darwin
          mv "$DIR"/*.dmg "$DIR/Mkdown_${VERSION}_${ARCH}.dmg"
          # 兜底：Release 不存在则先创建，说明取自标签说明（annotated tag message，写清更新内容，别再"见提交历史"）
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            git fetch -q origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}" --no-tags --force
            # 注意：必须用 %(contents) 取完整标签说明，不能用 %(contents:body)。
            # %(contents:body) 只返回第一段之后的正文；本仓库发布说明首段为「## 新特性」+其条目
            # （标题与列表间无空行），会被 Git 整体当作 subject 吞掉，导致新特性在 Release 正文丢失。
            git tag -l --format='%(contents)' "${{ github.ref_name }}" > rel-notes.md
            # 两个架构的 job 之间这里仍会抢一次：view 与 create 之间有窗口，后到的必撞
            # HTTP 422「Release.tag_name already exists」。把 create 的失败交给紧随其后的
            # view 兜底判定——对方刚建好即算成功（标题与正文同源于 annotated tag，谁建都一样），
            # 真出错时 view 也会失败，不会把故障吞成静默
            gh release create "${{ github.ref_name }}" --title "码克 MkDown ${{ github.ref_name }}" --notes-file rel-notes.md 2>/dev/null \
              || gh release view "${{ github.ref_name }}" >/dev/null
          fi
          gh release upload "${{ github.ref_name }}" --clobber "$DIR/Mkdown_${VERSION}_${ARCH}.dmg"
