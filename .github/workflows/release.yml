# 码克发布流水线（Windows + macOS 双端三产物，一个 workflow）
#
# 触发：push v* 标签自动跑；workflow_dispatch 手动跑（可指定 ref 为某个 tag，补传历史版本安装包）。
# 产物：Windows NSIS 安装包（x64）+ macOS 双架构 .dmg，tag 触发时按
#       Mkdown_${VERSION}_{x64-setup.exe | aarch64-apple-darwin.dmg | x86_64-apple-darwin.dmg}
#       规范成 ASCII 资产名挂到同名 GitHub Release（官网三条直链严格照这个模板）。
#
# 三个 job 的关系：prepare-release（几秒钟，只干「确保 Release 存在」这一件事）→
#   build-windows 与 build-macos 并行。这么摆有两个理由：
#   1) 三端总时长 ≈ 单端最长的那条（约 16 分钟），而不是串起来的 31 分钟；
#   2) Release 由唯一一个 job 创建，check-then-act 的抢建竞态（HTTP 422
#      Release.tag_name already exists，v0.6.0-patch.3 就栽过一次，f8cadac 只是兜底）
#      从根上消失，三个上传都只是往已存在的 Release 挂各自资产，
#      gh release upload --clobber 本身并发安全。
#   ★ prepare-release 里**不要**用 if 过滤非 tag 触发：needs 遇到 skipped 的上游会连带
#     跳过下游，那样 workflow_dispatch 就整个构建不了了。改成步骤内部空跑退出。
#
# macOS 侧前提：Tauri 的 mac 包只能在 macOS 上编译（Xcode 链路），本机 Windows 无法交叉编译，
#   故借用 GitHub 免费的 macos-14 运行器（macos-13 已退役，勿改回）。
#   签名/公证：当前 dmg **未做 Apple 代码签名与公证**（需 Apple Developer 凭证，属发布流程
#   后续项，不在 CI 伪造签名）。未公证产物首次打开会被 Gatekeeper 拦截，用户需右键打开或
#   `xattr -cr`；应用内自动更新侧的应对见 src-tauri/src/commands/update_cmd.rs 的 macOS 分支注释。
# Windows 侧说明：bundle.targets 里的 app/dmg 为 macOS 专属格式，Windows 侧用 --bundles nsis 显式限定。

name: release

on:
  workflow_dispatch: # 手动触发
  push:
    tags:
      - 'v*' # 打 v* 标签时自动构建

jobs:
  prepare-release:
    # gh release create 需要 Release 写权限（默认只读会 403）
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 要读 annotated tag 的完整说明

      - name: 确保同名 Release 存在（仅 tag 触发）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/* ]]; then
            echo "非 tag 触发（${GITHUB_REF}），不建 Release"
            exit 0
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} 已存在，跳过创建"
            exit 0
          fi
          # 注意：必须用 %(contents) 取完整标签说明，不能用 %(contents:body)。
          # %(contents:body) 只返回第一段之后的正文；本仓库发布说明首段为「## 新特性」+其条目
          # （标题与列表间无空行），会被 Git 整体当作 subject 吞掉，导致新特性在 Release 正文丢失。
          git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" > rel-notes.md
          # 兜底（v0.7.0 实测踩到）：标签对象一旦被解析成轻量引用，%(contents) 会退化成
          # **提交信息**，Release 描述整个变成 chore(release) 的 commit body（标题与分节全丢）。
          # 发版说明恒以「# 码克 vX.Y.Z」开头，首行不符就读 tag 树里的 docs/release-*.md ——
          # 那份文件本来就是 tag 正文的源，内容等价且不受引用解析方式影响。
          if ! head -1 rel-notes.md | LC_ALL=C grep -q '^# 码克'; then
            echo "::warning::标签说明首行非「# 码克」，回退到 docs/release-${GITHUB_REF_NAME}.md"
            git show "${GITHUB_REF_NAME}:docs/release-${GITHUB_REF_NAME}.md" > rel-notes.md
          fi
          gh release create "${GITHUB_REF_NAME}" --title "码克 MkDown ${GITHUB_REF_NAME}" --notes-file rel-notes.md

  build-windows:
    # 只等「Release 已就位」这一步，不等 macOS 构建
    needs: prepare-release
    # gh release upload 需要 GITHUB_TOKEN 具备 Release 写权限（默认只读会 403）
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      # —— 依赖审计（P2-5，报告级：只警告不阻断）——
      # 现有 xlsx 存在公开 CVE，直接设门禁会挂 CI，故两步均配置为报告级；
      # 待依赖整改后去掉 continue-on-error / || echo 收紧为阻断门禁。
      - name: 依赖审计（npm，报告级）
        # windows-latest 的 run 默认 shell 是 pwsh，其包装器结尾会 exit $LASTEXITCODE，
        # `|| echo` 救不回 npm audit 的退出码 1（v0.5.6 首跑实测被拦）；显式 bash 使 || 语义生效。
        shell: bash
        run: npm audit --audit-level=high || echo "::warning::npm audit findings (report-only)"

      - name: 依赖审计（cargo，报告级）
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
        continue-on-error: true

      - name: 构建（NSIS 安装包）
        run: npx tauri build --bundles nsis

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: makeke-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: 规范资产名并上传到 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          DIR="src-tauri/target/release/bundle/nsis"
          # 资产名统一 ASCII（productName 为中文，默认安装包名含中文在部分上传链路会被吞，见 2026-09-27 日志）
          mv "$DIR"/*-setup.exe "$DIR/Mkdown_${VERSION}_x64-setup.exe"
          # Release 由 prepare-release 建好，这里只挂资产；--clobber 让重跑同一 job 覆盖同名资产
          gh release upload "${{ github.ref_name }}" --clobber "$DIR/Mkdown_${VERSION}_x64-setup.exe"

  build-macos:
    # 与 build-windows 并行：两者都只 needs prepare-release
    needs: prepare-release
    # gh release upload 需要 GITHUB_TOKEN 具备 Release 写权限（默认只读会 403）
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin # Apple Silicon (M1/M2/M3/M4)
          - target: x86_64-apple-darwin # Intel
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装前端依赖
        run: npm ci

      # —— 依赖审计（P2-5，报告级：只警告不阻断）——
      # 与 build-windows 同口径；待依赖整改后收紧为阻断门禁。
      - name: 依赖审计（npm，报告级）
        run: npm audit --audit-level=high || echo "::warning::npm audit findings (report-only)"

      - name: 依赖审计（cargo，报告级）
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
        continue-on-error: true

      - name: 构建（dmg）
        run: |
          rustup target add ${{ matrix.target }}
          npx tauri build --target ${{ matrix.target }}

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: makeke-macos-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: 规范资产名并上传到 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          DIR="src-tauri/target/${{ matrix.target }}/release/bundle/dmg"
          # 资产名统一 ASCII（中文文件名在部分上传链路会被吞，见 2026-09-27 日志）
          ARCH=${{ matrix.target }}   # aarch64-apple-darwin / x86_64-apple-darwin
          mv "$DIR"/*.dmg "$DIR/Mkdown_${VERSION}_${ARCH}.dmg"
          # Release 由 prepare-release 建好，这里只挂资产；两个架构并行上传互不影响
          gh release upload "${{ github.ref_name }}" --clobber "$DIR/Mkdown_${VERSION}_${ARCH}.dmg"
